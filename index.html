<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amateur Radioteletype Terminal</title>
    <script>
      const originalWarn = console.warn
      console.warn = (...args) => {
        if (args[0] && args[0].includes('cdn.tailwindcss.com')) return
        originalWarn(...args)
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/teletype-icon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    >
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
