<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletype Minimal</title>

  <!-- Tailwind CDN -->
   <script>
  const originalWarn = console.warn
  console.warn = (...args) => {
    if (args[0] && args[0].includes('cdn.tailwindcss.com')) return
    originalWarn(...args)
  }
</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-900 text-green-400 font-mono min-h-screen flex items-start justify-center p-2 sm:p-6">
  <div class="w-full max-w-4xl bg-black border border-green-700 rounded-xl shadow-lg p-4 sm:p-6">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-lg tracking-widest">TELETYPE</h1>
      <span class="text-xs text-green-600">v1.0</span>
    </div>

    <div class="mb-4 flex items-center gap-2">
      <div class="w-2 h-2 bg-green-500 rounded-full"></div>
      <span id="status" class="text-sm text-green-300">Idle</span>
    </div>

    <div class="mb-6 space-y-2">
      <button id="random" class="w-full bg-green-700 py-3 sm:py-3.5 rounded-lg hover:bg-green-600 active:bg-green-500 transition text-base sm:text-sm">
        Start Random Match
      </button>

      <!-- Screen share only visible on desktop -->
      <button id="share" class="hidden sm:block w-full bg-blue-700 py-2 rounded-lg hover:bg-blue-600 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed">
        Share Screen
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
      <video id="local" autoplay muted playsinline class="w-full aspect-video bg-black border border-green-700 rounded-lg"></video>
      <video id="remote" autoplay playsinline class="w-full aspect-video bg-black border border-green-700 rounded-lg"></video>
    </div>

    <div class="mt-4 border border-green-700 rounded-lg p-2 h-32 sm:h-40 overflow-y-auto text-sm" id="chatBox"></div>

    <textarea
      id="chatInput"
      placeholder="Type message and press Enter..."
      rows="2"
      autocomplete="off"
      class="w-full mt-2 bg-black border border-green-700 px-3 py-3 rounded text-green-300 resize-none text-base"
    ></textarea>

  </div>
  <script src="app.js"></script>
</body>
</html>
